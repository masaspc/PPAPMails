{% extends "base.html" %}
{% block title %}認証コード入力 - Secure Download{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-lg shadow-md p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-700 mb-2">認証コード入力</h1>
            <p class="text-gray-500 text-sm">メールに送信された6桁のコードを入力してください</p>
        </div>

        <form id="verifyForm" class="space-y-4">
            <div>
                <label for="code" class="block text-sm font-medium text-gray-700 mb-1">
                    認証コード
                </label>
                <input type="text" id="code" name="code" required
                       maxlength="6" pattern="[0-9]{6}"
                       placeholder="000000"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-center text-2xl tracking-widest">
            </div>
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors font-medium">
                認証する
            </button>
        </form>

        <div id="errorMsg" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"></div>
    </div>
</div>
{% endblock %}
