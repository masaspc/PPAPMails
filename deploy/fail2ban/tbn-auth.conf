# TBN Secure Download - fail2ban設定
# /etc/fail2ban/jail.d/tbn-auth.conf

[tbn-auth]
enabled = true
port = http,https
filter = tbn-auth
logpath = /var/log/tbn-secure-download/access.log
maxretry = 10
findtime = 600
bantime = 3600
action = iptables-multiport[name=tbn-auth, port="http,https", protocol=tcp]

# フィルター定義
# /etc/fail2ban/filter.d/tbn-auth.conf
