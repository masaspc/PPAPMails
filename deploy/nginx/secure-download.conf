# Secure Download - Nginx設定
# /etc/nginx/sites-available/secure-download.conf

upstream sd_app {
    server 127.0.0.1:8000;
}

# HTTP -> HTTPS リダイレクト
server {
    listen 80;
    server_name download.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS メインサーバー
server {
    listen 443 ssl http2;
    server_name download.example.com;

    # SSL証明書 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/download.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/download.example.com/privkey.pem;

    # SSL設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # セキュリティヘッダー
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data:;" always;

    # ファイルアップロードサイズ制限
    client_max_body_size 55M;

    # ログ
    access_log /var/log/nginx/secure-download-access.log;
    error_log /var/log/nginx/secure-download-error.log;

    # FastAPIアプリケーションへのプロキシ
    location / {
        proxy_pass http://sd_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 10;
    }

    # ヘルスチェック（LB用）
    location /internal/health {
        proxy_pass http://sd_app;
        proxy_set_header Host $host;
        access_log off;
    }
}

# SMTP用（Postfix側で処理するため、ここではTLS終端は不要）
