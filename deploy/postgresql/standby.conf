# TBN Secure Download - PostgreSQL Standby設定
# /etc/postgresql/16/main/conf.d/tbn-replication.conf

# Standby設定
hot_standby = on
hot_standby_feedback = on

# Primary接続情報 (recovery.conf / standby.signal)
# primary_conninfo は postgresql.auto.conf に設定される
# pg_basebackup 実行後に standby.signal ファイルが作成される

# パフォーマンスチューニング (2GB RAM向け)
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 4MB
maintenance_work_mem = 128MB

# 接続設定
listen_addresses = 'localhost'
port = 5432

# ログ
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'ddl'
log_min_duration_statement = 1000

# セットアップ手順:
# 1. Standby側でPostgreSQLを停止
#    sudo systemctl stop postgresql
#
# 2. データディレクトリをクリア
#    sudo rm -rf /var/lib/postgresql/16/main/*
#
# 3. pg_basebackupでPrimaryからコピー
#    sudo -u postgres pg_basebackup -h ${PRIMARY_PRIVATE_IP} -U replicator -D /var/lib/postgresql/16/main -P -R
#
# 4. standby.signalが作成されていることを確認
#    ls -la /var/lib/postgresql/16/main/standby.signal
#
# 5. Standby起動
#    sudo systemctl start postgresql
#
# 6. レプリケーション状態確認 (Primary側で実行)
#    SELECT * FROM pg_stat_replication;
#
# フェイルオーバー手順:
# 1. Standby側でPromote
#    sudo -u postgres pg_ctl promote -D /var/lib/postgresql/16/main
# 2. アプリケーション再起動
#    sudo systemctl restart tbn-secure-download
