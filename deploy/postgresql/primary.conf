# TBN Secure Download - PostgreSQL Primary設定
# /etc/postgresql/16/main/conf.d/tbn-replication.conf

# Streaming Replication設定 (Primary)
wal_level = replica
max_wal_senders = 3
wal_keep_size = 256MB

# レプリケーションスロット使用
max_replication_slots = 3

# 同期モード (非同期: パフォーマンス優先)
synchronous_commit = on

# アーカイブ (バックアップ用)
archive_mode = on
archive_command = 'cp %p /var/lib/postgresql/archive/%f'

# 接続設定
listen_addresses = 'localhost, ${PRIVATE_IP}'
port = 5432

# パフォーマンスチューニング (2GB RAM向け)
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 4MB
maintenance_work_mem = 128MB

# WAL設定
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 80MB

# ログ
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'ddl'
log_min_duration_statement = 1000

# pg_hba.conf に以下を追加:
# host  replication  replicator  ${STANDBY_PRIVATE_IP}/32  md5
# host  tbn_secure_download  tbn_app  127.0.0.1/32  md5
